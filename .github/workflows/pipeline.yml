name: Wellness Tourism Package Predictor

on:
  push:
    branches:
      - main            # Automatically triggers on push to the main branch
  workflow_dispatch:     # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write

jobs:
  # ---------- JOB 1: Register Dataset ----------
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------- JOB 2: Data Preparation ----------
  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn joblib
      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            tourism_project/data_splits/Xtrain.csv
            tourism_project/data_splits/Xtest.csv
            tourism_project/data_splits/ytrain.csv
            tourism_project/data_splits/ytest.csv
      - name: Upload Preprocessor
        uses: actions/upload-artifact@v4
        with:
          name: model-preprocessor
          path: tourism_project/deployment/preprocessor.joblib

  # ---------- JOB 3: Model Training + MLflow Tracking ----------
  model-traning:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas xgboost scikit-learn joblib mlflow
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/data_splits/
      - name: Download Preprocessor
        uses: actions/download-artifact@v4
        with:
          name: model-preprocessor
          path: tourism_project/deployment/
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 &  # Run MLflow UI in the background
          sleep 5  # Wait for a moment to let the server start
      - name: Model Building
        run: python tourism_project/model_building/train.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/best_model.joblib tourism_project/deployment/preprocessor.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git push
